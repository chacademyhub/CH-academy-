<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Athar physical performance</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --primary: #E67E22; --secondary: #F2B01E; --bg: #F2F2F7; --card: #FFFFFF; --text: #1C1C1E; --gray: #8E8E93; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); min-height: 100vh; padding: 40px 20px; position: relative; color: var(--text); }
  .lang-switch { position: fixed; top: 20px; left: 20px; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 30px; padding: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; gap: 2px; z-index: 100; }
  .lang-switch button { background: transparent; border: none; padding: 8px 16px; border-radius: 25px; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 13px; color: var(--gray); transition: 0.3s; }
  .lang-switch button.active { background: #fff; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .container { max-width: 480px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 28px; padding: 40px 25px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.04); margin-bottom: 20px; transition: transform 0.3s; }
  .brand-logo { width: 100%; max-width: 260px; height: auto; margin: 0 auto 20px; display: block; object-fit: contain; }
  h1 { color: var(--text); font-size: 26px; margin-bottom: 4px; font-weight: 800; letter-spacing: -0.5px; }
  .subtitle { color: var(--primary); font-size: 12px; margin-bottom: 30px; letter-spacing: 1.5px; font-weight: 700; text-transform: uppercase; }
  .name { font-size: 22px; color: var(--text); font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px; }
  .dob-text { color: var(--gray); font-size: 14px; margin-bottom: 16px; }
  .label { color: var(--gray); font-size: 15px; font-weight: 500; }
  .sessions { font-size: 90px; font-weight: 800; line-height: 1; color: var(--primary); margin: 10px 0; letter-spacing: -2px; }
  .sessions.low { color: #FF9500; }
  .sessions.zero { color: #FF3B30; }
  .unit { color: var(--gray); font-size: 16px; margin-bottom: 20px; font-weight: 500; }
  .progress-wrap { background: #E5E5EA; border-radius: 20px; height: 14px; overflow: hidden; margin: 20px 0 10px; }
  .progress-bar { height: 100%; background: var(--primary); border-radius: 20px; transition: width 0.8s cubic-bezier(0.25, 0.8, 0.25, 1); }
  .progress-text { color: var(--gray); font-size: 13px; margin-bottom: 20px; font-weight: 500; }
  .notice { background: #FFF3E0; color: #E65100; padding: 14px; border-radius: 16px; font-size: 14px; font-weight: 600; margin-bottom: 16px; }
  .notice.red { background: #FFEBEE; color: #B71C1C; }
  .schedule-box { display: none; background: #E3F2FD; padding: 14px; border-radius: 16px; margin-bottom: 16px; color: #0D47A1; font-weight: 600; font-size: 14px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .stat { background: var(--bg); padding: 16px; border-radius: 20px; }
  .stat .stat-label { color: var(--gray); font-size: 12px; margin-bottom: 6px; font-weight: 600; }
  .stat .stat-value { color: var(--text); font-size: 22px; font-weight: 800; }
  .stat.pay .stat-value { color: var(--primary); }
  .section { background: var(--card); border-radius: 28px; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); margin-bottom: 20px; }
  .section h3 { color: var(--text); font-size: 18px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; font-weight: 800; letter-spacing: -0.3px; }
  .section h3 .count { background: var(--bg); color: var(--gray); padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: 700; }
  .history-item { padding: 14px 16px; background: var(--bg); border-radius: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; }
  .history-item .hdate { color: var(--gray); font-size: 12px; direction: ltr; font-weight: 500; }
  .history-item .hamount { color: var(--primary); font-weight: 800; font-size: 16px; }
  .history-item .hnote { color: var(--text); flex: 1; min-width: 100px; text-align: right; font-weight: 600; }
  .empty { color: var(--gray); text-align: center; padding: 20px; font-size: 14px; font-weight: 500; }
  .spinner { border: 4px solid #E5E5EA; border-top-color: var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 30px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: #FF3B30; font-size: 15px; padding: 25px; line-height: 1.6; text-align: center; font-weight: 600; }
  .footer { color: var(--gray); font-size: 12px; margin-top: 20px; text-align: center; font-weight: 500; }
  .footer a { color: var(--primary); text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
<div class="lang-switch">
  <button id="btnAr" onclick="setLang('ar')">العربية</button>
  <button id="btnEn" onclick="setLang('en')">EN</button>
</div>
<div class="container">
  <div class="card">
    <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
    <h1 id="brandName">Athar physical performance</h1>
    <p class="subtitle" id="brandSubtitle">ATHAR PHYSICAL PERFORMANCE</p>
    <div id="loading"><div class="spinner"></div><p class="label" id="loadingText">جاري التحميل...</p></div>
    <div id="result" style="display:none;">
      <div class="name" id="studentName"></div>
      <div id="dobBox" class="dob-text" style="display:none;"></div>
      <div id="scheduleBox" class="schedule-box"></div>
      <p class="label" id="remainingLabel">باقي لك</p>
      <div class="sessions" id="remaining"></div>
      <p class="unit" id="unitText">حصة</p>
      <div class="progress-wrap"><div class="progress-bar" id="bar" style="width:0%"></div></div>
      <p class="progress-text" id="progressText"></p>
      <div id="noticeBox"></div>
    </div>
    <div id="error" class="error" style="display:none;"></div>
  </div>
  <div id="extras" style="display:none;">
    <div class="section">
      <h3><span>💰 <span id="payTitle">المدفوعات</span></span></h3>
      <div class="stats">
        <div class="stat pay"><div class="stat-label" id="totalPaidLabel">إجمالي مدفوع</div><div class="stat-value" id="totalPaid">0</div></div>
        <div class="stat"><div class="stat-label" id="lastPayLabel">آخر دفعة</div><div class="stat-value" id="lastPay" style="font-size:14px;">—</div></div>
      </div>
      <div id="paymentsList" style="margin-top:14px;"></div>
    </div>
    <div class="section">
      <h3><span>📋 <span id="attTitle">آخر الحصص</span></span><span class="count" id="attCount">0</span></h3>
      <div id="attendanceList"></div>
    </div>
  </div>
  <div class="footer" id="footerText"></div>
</div>
<script>
  const T = {
    ar: { title: 'رصيد الحصص', loading: 'جاري التحميل...', remaining: 'باقي لك', unit: 'حصة', used: 'استُخدمت', of: 'من أصل', exhausted: 'انتهت حصصك. يرجى التجديد.', lowBalance: 'رصيدك منخفض. ننصح بالتجديد.', payments: 'المدفوعات', totalPaid: 'إجمالي مدفوع', lastPay: 'آخر دفعة', attendance: 'آخر الحصص', noAttendance: 'لا توجد حصص مسجلة', noPayments: 'لا توجد مدفوعات', methodCash: 'نقداً', methodBank: 'تحويل', methodCard: 'بطاقة', errInvalid: '⚠️ رابط غير صحيح<br>امسح رمز QR من جديد.', errAuth: '🔒 رابط غير صحيح.', errNotFound: '❓ لم نجد بياناتك.', errRate: '⏳ حاول لاحقاً.', errMissing: '⚠️ رابط ناقص.', errNetwork: '📡 تعذر الاتصال.', errGeneric: 'حدث خطأ.', scheduleLabel: '🗓️ المواعيد: ', dobLabel: '🎂 تاريخ الميلاد: ', footerDefault: 'Athar physical performance © للاستفسار تواصل مع الإدارة' },
    en: { title: 'Session Balance', loading: 'Loading...', remaining: 'Remaining', unit: 'sessions', used: 'Used', of: 'of', exhausted: 'No sessions left. Please renew.', lowBalance: 'Low balance.', payments: 'Payments', totalPaid: 'Total paid', lastPay: 'Last payment', attendance: 'Recent sessions', noAttendance: 'No sessions recorded', noPayments: 'No payments', methodCash: 'Cash', methodBank: 'Bank', methodCard: 'Card', errInvalid: '⚠️ Invalid link<br>Scan QR again.', errAuth: '🔒 Invalid link.', errNotFound: '❓ Student not found.', errRate: '⏳ Try later.', errMissing: '⚠️ Incomplete link.', errNetwork: '📡 Connection failed.', errGeneric: 'Error occurred.', scheduleLabel: '🗓️ Schedule: ', dobLabel: '🎂 DOB: ', footerDefault: 'Athar physical performance © For inquiries, contact administration' }
  };
  const params = new URLSearchParams(window.location.search);
  const API_URL = params.get('api') || 'https://script.google.com/macros/s/AKfycbytOQxd59nU6cfa46BT-M1ry3alyhG_Jngdm-1GBouf7M32HA8d6jOvWPxOIh1IyCEa8w/exec'; // الرابط الجديد
  const id = params.get('id'); const key = params.get('key');
  let LANG = params.get('lang') || localStorage.getItem('ch_lang') || (navigator.language && navigator.language.toLowerCase().startsWith('ar') ? 'ar' : 'en') || 'ar';
  localStorage.setItem('ch_lang', LANG);
  let PUBLIC_CONFIG = { primaryColor: '#E67E22', secondaryColor: '#F2B01E', brandName: 'Athar physical performance', brandSubtitle: 'ATHAR PHYSICAL PERFORMANCE', footerTextAr: 'Athar physical performance © للاستفسار تواصل مع الإدارة', footerTextEn: 'Athar physical performance © For inquiries, contact administration', inquiryPhone: '' };
  function fmtDate(ts) { if (!ts) return '—'; return new Date(ts).toLocaleDateString(LANG === 'ar' ? 'ar-AE' : 'en-GB', { year: 'numeric', month: 'short', day: 'numeric' }); }
  function applyConfig() {
    document.documentElement.style.setProperty('--primary', PUBLIC_CONFIG.primaryColor);
    document.documentElement.style.setProperty('--secondary', PUBLIC_CONFIG.secondaryColor);
    document.getElementById('brandName').textContent = PUBLIC_CONFIG.brandName;
    document.getElementById('brandSubtitle').textContent = PUBLIC_CONFIG.brandSubtitle;
    document.title = PUBLIC_CONFIG.brandName + ' — ' + T[LANG].title;
    const ft = LANG === 'ar' ? PUBLIC_CONFIG.footerTextAr : PUBLIC_CONFIG.footerTextEn;
    document.getElementById('footerText').innerHTML = PUBLIC_CONFIG.inquiryPhone ? `${ft} — <a href="tel:${PUBLIC_CONFIG.inquiryPhone}">${PUBLIC_CONFIG.inquiryPhone}</a>` : ft;
  }
  function setLang(lang) {
    LANG = lang; localStorage.setItem('ch_lang', lang);
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('btnAr').classList.toggle('active', lang === 'ar'); document.getElementById('btnEn').classList.toggle('active', lang === 'en');
    document.getElementById('loadingText').textContent = T[lang].loading; document.getElementById('remainingLabel').textContent = T[lang].remaining;
    document.getElementById('unitText').textContent = T[lang].unit; document.getElementById('payTitle').textContent = T[lang].payments;
    document.getElementById('totalPaidLabel').textContent = T[lang].totalPaid; document.getElementById('lastPayLabel').textContent = T[lang].lastPay;
    document.getElementById('attTitle').textContent = T[lang].attendance; applyConfig(); if (window.LAST_DATA) renderAll(window.LAST_DATA);
  }
  function fail(msg) { document.getElementById('loading').style.display = 'none'; const e = document.getElementById('error'); e.style.display = 'block'; e.innerHTML = msg; }
  function renderMain(d) {
    document.getElementById('loading').style.display = 'none'; document.getElementById('error').style.display = 'none';
    document.getElementById('result').style.display = 'block'; document.getElementById('studentName').textContent = d.name;
    const dobBox = document.getElementById('dobBox'); if (d.dob) { dobBox.style.display = 'block'; dobBox.innerHTML = T[LANG].dobLabel + d.dob; } else { dobBox.style.display = 'none'; }
    const schBox = document.getElementById('scheduleBox'); if (d.schedule) { schBox.style.display = 'block'; schBox.innerHTML = T[LANG].scheduleLabel + d.schedule; } else { schBox.style.display = 'none'; }
    const rem = document.getElementById('remaining'); rem.textContent = d.remaining; rem.className = 'sessions';
    if (d.remaining === 0) rem.classList.add('zero'); else if (d.remaining <= 2) rem.classList.add('low');
    const pct = d.total > 0 ? Math.min(100, (d.used / d.total) * 100) : 0;
    document.getElementById('bar').style.width = pct + '%';
    document.getElementById('progressText').textContent = T[LANG].used + ' ' + d.used + ' ' + T[LANG].of + ' ' + d.total + ' ' + T[LANG].unit;
    const notice = document.getElementById('noticeBox');
    if (d.remaining === 0) notice.innerHTML = `<div class="notice red">${T[LANG].exhausted}</div>`;
    else if (d.remaining <= 2) notice.innerHTML = `<div class="notice">${T[LANG].lowBalance}</div>`; else notice.innerHTML = '';
  }
  function renderExtras(d) {
    document.getElementById('extras').style.display = 'block';
    document.getElementById('totalPaid').textContent = (d.paid || 0) + ' د.إ';
    document.getElementById('lastPay').textContent = d.lastPaymentDate ? fmtDate(d.lastPaymentDate) : '—';
    const payList = document.getElementById('paymentsList');
    if (d.recentPayments && d.recentPayments.length) { payList.innerHTML = d.recentPayments.slice(0, 3).map(p => `<div class="history-item pay"><div class="hamount">${p.amount} د.إ</div><div class="hnote">${T[LANG]['method' + (p.method === 'cash' ? 'Cash' : p.method === 'bank' ? 'Bank' : 'Card')] || p.method}</div><div class="hdate">${fmtDate(p.date)}</div></div>`).join(''); } else { payList.innerHTML = `<p class="empty">${T[LANG].noPayments}</p>`; }
    const attList = document.getElementById('attendanceList'); document.getElementById('attCount').textContent = (d.recentAttendance || []).length;
    if (d.recentAttendance && d.recentAttendance.length) { attList.innerHTML = d.recentAttendance.map(a => `<div class="history-item"><div class="hnote">${a.note || '✓'}</div><div class="hdate">${fmtDate(a.date)}</div></div>`).join(''); } else { attList.innerHTML = `<p class="empty">${T[LANG].noAttendance}</p>`; }
  }
  function renderAll(d) { window.LAST_DATA = d; renderMain(d); renderExtras(d); }
  document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('btnAr').classList.toggle('active', LANG === 'ar'); document.getElementById('btnEn').classList.toggle('active', LANG === 'en');
  document.getElementById('loadingText').textContent = T[LANG].loading; document.getElementById('remainingLabel').textContent = T[LANG].remaining;
  document.getElementById('unitText').textContent = T[LANG].unit; document.getElementById('payTitle').textContent = T[LANG].payments;
  document.getElementById('totalPaidLabel').textContent = T[LANG].totalPaid; document.getElementById('lastPayLabel').textContent = T[LANG].lastPay;
  document.getElementById('attTitle').textContent = T[LANG].attendance;
  if (API_URL) {
    fetch(API_URL + '?action=public_config').then(r => r.json()).then(d => { if (d.success) PUBLIC_CONFIG = { ...PUBLIC_CONFIG, ...d.config }; }).catch(() => {}).finally(() => {
      applyConfig();
      if (!id || !key) { fail(T[LANG].errInvalid); return; }
      fetch(API_URL + '?action=check&id=' + encodeURIComponent(id) + '&key=' + encodeURIComponent(key)).then(r => r.json()).then(d => {
        if (!d.success) { const m = { AUTH: 'errAuth', NOT_FOUND: 'errNotFound', RATE: 'errRate', MISSING: 'errMissing' }; return fail(T[LANG][m[d.code]] || T[LANG].errGeneric); }
        renderAll(d);
      }).catch(() => fail(T[LANG].errNetwork));
    });
  } else { applyConfig(); fail(T[LANG].errInvalid); }
</script>
</body>
</html>
