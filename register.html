<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التسجيل - C.H Academy</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%); min-height: 100vh; padding: 20px; }
  .container { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
  .header { text-align: center; margin-bottom: 20px; }
  .header img { width: 100px; height: 100px; border-radius: 50%; }
  h1 { color: #E67E22; margin-bottom: 5px; font-size: 24px; }
  p.subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
  
  .section-title { font-size: 16px; color: #1565c0; margin: 20px 0 10px; border-bottom: 2px solid #eee; padding-bottom: 5px; font-weight: bold; }
  .packages, .levels { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; }
  .card { background: #f9f9f9; border: 2px solid #eee; border-radius: 10px; padding: 15px; min-width: 140px; text-align: center; cursor: pointer; transition: 0.2s; }
  .card:hover { border-color: #E67E22; }
  .card.selected { border-color: #E67E22; background: #fff3e0; }
  .card h4 { color: #333; font-size: 15px; margin-bottom: 5px; }
  .card .price { color: #2e7d32; font-weight: bold; font-size: 18px; }
  .card .sessions { color: #666; font-size: 12px; }
  .card .desc { color: #666; font-size: 12px; margin-top: 5px; text-align: right; line-height: 1.4; }
  
  input, select, textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 12px; font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #E67E22; }
  label { display: block; margin-bottom: 5px; color: #555; font-size: 13px; font-weight: bold; }
  
  button { width: 100%; padding: 15px; background: #E67E22; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  button:hover { background: #d36e17; }
  .success-msg { display: none; text-align: center; color: #2e7d32; font-weight: bold; padding: 20px; background: #e8f5e9; border-radius: 10px; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
    <h1>C.H Academy</h1>
    <p class="subtitle">استمارة تسجيل طالب جديد</p>
  </div>

  <form id="regForm" onsubmit="submitForm(event)">
    
    <div class="section-title">👤 بيانات الطالب</div>
    <label>اسم الطالب بالكامل *</label>
    <input type="text" id="name" required placeholder="الاسم الثلاثي">
    
    <label>تاريخ ميلاد الطالب</label>
    <input type="date" id="dob">
    
    <label>المواعيد المفضلة للتدريب</label>
    <input type="text" id="schedule" placeholder="مثال: السبت والثلاثاء الساعة 5 م">

    <div class="section-title">📱 بيانات ولي الأمر</div>
    <label>رقم جوال ولي الأمر *</label>
    <input type="tel" id="phone" required placeholder="05xxxxxxxx" dir="ltr">
    
    <label>البريد الإلكتروني</label>
    <input type="email" id="email" placeholder="example@email.com" dir="ltr">

    <div class="section-title">🏊‍♂️ الباكدجات المتاحة (اختر واحدة)</div>
    <div class="packages" id="packagesList">
      <p style="color:#999;">جاري التحميل...</p>
    </div>

    <div class="section-title">🏅 مستويات السباحة (للاطلاع)</div>
    <div class="levels" id="levelsList" style="flex-direction: column;">
      <p style="color:#999;">جاري التحميل...</p>
    </div>

    <button type="submit" id="submitBtn">إرسال طلب التسجيل</button>
    <div id="successMsg" class="success-msg">✅ تم إرسال طلبك بنجاح!<br>سنتواصل معك قريباً لتأكيد الحجز.</div>
  </form>
</div>

<script>
  // تم تحديث الرابط الجديد هنا
  let API_URL = 'https://script.google.com/macros/s/AKfycbxaC4pnWsxR0hx_nbGtcDlOQm_GmKqIWEYRosdC44XpUDmJ8SfzgRujSn8CuGkp6BDfVA/exec';
  let selectedPkg = '';

  window.onload = function() {
    fetch(API_URL + '?action=get_public_data')
      .then(r => r.json())
      .then(d => {
        if (d.success) {
          renderPackages(d.packages);
          renderLevels(d.levels);
        }
      })
      .catch(() => {
        document.getElementById('packagesList').innerHTML = '<p style="color:red;">تعذر تحميل البيانات</p>';
        document.getElementById('levelsList').innerHTML = '';
      });
  };

  function renderPackages(pkgs) {
    const container = document.getElementById('packagesList');
    if (!pkgs || !pkgs.length) { container.innerHTML = '<p>لا توجد باكدجات متاحة حالياً.</p>'; return; }
    
    // التصحيح هنا: بنقرأ الاسم والسعر كـ object مش array
    container.innerHTML = pkgs.map(p => `
      <div class="card" onclick="selectPkg(this, '${p.name}')">
        <h4>${p.name}</h4>
        <div class="price">${p.price} د.إ</div>
        <div class="sessions">${p.sessions} حصة</div>
      </div>
    `).join('');
  }

  function renderLevels(lvls) {
    const container = document.getElementById('levelsList');
    if (!lvls || !lvls.length) { container.innerHTML = '<p>لا توجد مستويات مضافة.</p>'; return; }
    
    // التصحيح هنا برضه
    container.innerHTML = lvls.map(l => `
      <div class="card" style="min-width: 100%; text-align: right; cursor: default;">
        <h4 style="color:#1565c0;">${l.name}</h4>
        <div class="desc">${l.desc}</div>
      </div>
    `).join('');
  }

  function selectPkg(el, name) {
    document.querySelectorAll('.packages .card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedPkg = name;
  }

  function submitForm(e) {
    e.preventDefault();
    if (!selectedPkg) { alert('من فضلك اختر الباكدج أولاً'); return; }
    
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'جاري الإرسال...';

    const params = {
      action: 'register',
      name: document.getElementById('name').value,
      dob: document.getElementById('dob').value,
      phone: document.getElementById('phone').value,
      email: document.getElementById('email').value,
      schedule: document.getElementById('schedule').value,
      packageName: selectedPkg,
      levelName: '' 
    };

    const qs = Object.entries(params).map(([k,v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
    
    fetch(API_URL + '?' + qs)
      .then(r => r.json())
      .then(d => {
        if (d.success) {
          document.getElementById('regForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          alert(d.message || 'حدث خطأ، حاول لاحقاً');
          btn.disabled = false; btn.textContent = 'إرسال طلب التسجيل';
        }
      })
      .catch(() => {
        alert('تعذر الاتصال بالخادم');
        btn.disabled = false; btn.textContent = 'إرسال طلب التسجيل';
      });
  }
</script>
</body>
</html>
